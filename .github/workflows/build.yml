name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://nazkizshipmmrpnpkrlj.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_cTLnmn34pCSkgNkZZD79Lw_bkHBSrL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Crear proyecto
        run: |
          unzip -o run-team-v2.zip -d src_zip
          npx --yes create-expo-app@latest app --template blank --yes
          cd app
          npx expo install @supabase/supabase-js @react-native-async-storage/async-storage react-native-url-polyfill expo-document-picker
          cp ../src_zip/App.js .
          cp -r ../src_zip/src .
          node -e "const f='app.json';const j=require('./'+f);j.expo.name='Run Team';j.expo.scheme='runteam';j.expo.android={...(j.expo.android||{}),package:'com.runteam.equipo'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
      - name: Generar proyecto Android
        working-directory: app
        run: npx expo prebuild --platform android
      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: run-team-apk
          path: app/android/app/build/outputs/apk/release/*.apk
